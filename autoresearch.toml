# ggml's GPT-2, searched for faster token generation by autoresearch (plan 15b of
# pi-autoresearch-serverless): agents rewrite gpt-2-backend's inference code and ggml's CPU backend.
# Each round generates 512 tokens greedily, under a repetition penalty, from a prompt of random words
# that bench/gen draws for each attempt; the metric is tokens per second over the round's wall time.
# The gate, eval/check, replays the root's own model, from the baseline's build, on the candidate's
# tokens: each must be the root's greedy choice, but where two tokens nearly tie.


[agents]
max_tokens = 3000000

[metric]
name = "tokens_per_s"
direction = "maximize"
scale = "ratio"
source = "score"

[scope]
allow  = ["examples/gpt-2/main-backend.cpp", "src/ggml-cpu/**"]
locked = ["**/CMakeLists.txt", "**/*.cmake", "**/*.cmake.in", "CMakePresets.json", "CMakeUserPresets.json", "vcpkg.json", "conanfile.*", "examples/gpt-2/verify.cpp", "bench/**", "eval/**"]

[image]
# gcc:14.3.0-bookworm, by its multi-arch digest: the cmake template's base.
base  = "docker.io/library/gcc@sha256:5e927c284bf55a7dc796262e311a0703344f62f41f5621eb56843111b1d37e15"
fetch = "sh bench/fetch"

[build]
outputs = ["build/bin/gpt-2-backend", "build/bin/gpt-2-verify"]

[steps]
build    = { cmd = "cmake --build build --target gpt-2-backend gpt-2-verify", timeout_secs = 1200 }
generate = { cmd = "sh bench/gen $SEED $INPUTS", timeout_secs = 60 }
run      = { cmd = "$BUILD/build/bin/gpt-2-backend -m /opt/models/ggml-model-gpt-2-117M.bin -f $INPUTS/prompt.txt -n 512 -t 4 --top_k 1 -s 1 --repeat-penalty 1.3 --repeat-last-n 256 --ignore-eos --tokens-out $OUTPUTS/tokens.txt", timeout_secs = 180 }
check    = { cmd = "sh eval/check $INPUTS $BASELINE_BUILD $BASELINE_OUT $CANDIDATE_OUT", timeout_secs = 900 }
score    = { cmd = "sh eval/tps $OUTPUTS $WALL_MS", timeout_secs = 30 }

[paired]
# The warm-up rounds also bring the model's 251 MB into the page cache.
warmup = 1
rounds = 5
min_run_ms = 1000

[resources]
cpu = 4
memory_gib = 4
task_timeout_secs = 1800
